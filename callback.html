<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;background:#0a0a0a;color:#C9A84C;text-align:center;padding:60px">
<h1>Iron Jungle — Código de Autorização</h1>
<div id="code" style="background:#1a1a1a;padding:20px;border-radius:10px;margin:20px;word-break:break-all;color:#fff;font-size:14px"></div>
<script>
const params = new URLSearchParams(window.location.search);
const code = params.get('code');
document.getElementById('code').textContent = code ? 'CÓDIGO: ' + code : 'Nenhum código encontrado';
</script>
</body>
</html>
